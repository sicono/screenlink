name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk ScreenLink.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLink-apk
          path: ScreenLink.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: ScreenLink para Android
          make_latest: true
          files: ScreenLink.apk
          body: |
            App Android para compartir la pantalla del móvil.
            Instálala, pulsa «Empezar a compartir» y escribe el código en https://sicono.github.io/screenlink/
